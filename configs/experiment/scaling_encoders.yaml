# Larger-model scaling probe (Section 6.2, Table 7): larger encoders on
# SST-2, MRPC and STS-B. Keep it in its own cache / results directory:
#
#   EXPERIMENT=scaling_encoders CACHE_ROOT=outputs/scaling_encoders/cache \
#     RESULTS_DIR=results/scaling_encoders scripts/run_sweep.sh
defaults:
  - _base

mode: sweep
models:
  - deberta_v3_large
  - xlm_roberta_large

datasets:
  - sst2
  - mrpc
  - sts_b

tasks: __auto_from_dataset__
probes: [linear, nonlinear]
poolings: __task_default_plus_alternatives__
seeds: [42, 1337, 2024]
parallelism:
  models_in_parallel: 1
  datasets_in_parallel: 1
