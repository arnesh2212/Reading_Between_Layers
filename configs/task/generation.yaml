defaults:
  - _base
  - _self_

name: generation
metric_primary: perplexity
metrics_secondary: [bleu, rouge, exact_match]
pooling_default: last_token
pooling_options: [last_token]
allowed_families: [decoder, encoder_decoder, ssm]
probe_type_default: linear
probe_types_allowed: [linear, nonlinear, lora, full_ft]
needs_labels_for_geometry: false
